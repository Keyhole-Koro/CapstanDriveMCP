[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "capstan-drive"
version = "0.1.0"
description = "Capstan-driven joint on an ODrive S1 over USB, with an MCP server for LLMs"
requires-python = ">=3.10"
dependencies = [
    "odrive==0.6.11.post1",
    "mcp==2.3.0",
]

[project.scripts]
capstan-mcp = "capstan.server:main"

[tool.setuptools.packages.find]
where = ["src"]
